name: Refresh dividend data
on:
  schedule:
    - cron: "47 3,11,19 * * *"   # every 8 hours (23:47, 7:47 and 15:47 ET, just after the 7:30 AM and 10:30 PM seed additions); each run adds new seed tickers first and refreshes the stalest, 45 per run. Each data change redeploys the site and Actions artifact storage is limited, so keep this modest
  workflow_dispatch:
    inputs:
      batch:
        description: "Tickers to refresh this run"
        default: "45"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-data.mjs
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          BATCH: ${{ inputs.batch }}
      - name: Commit changes
        run: |
          git config user.name "payout-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Refresh dividend data" && git push)
