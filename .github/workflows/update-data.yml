name: Refresh dividend data
on:
  schedule:
    - cron: "47 3,11,19 * * *"   # every 8 hours (23:47, 7:47 and 15:47 ET, just after the 7:30 AM and 10:30 PM seed additions); each run refreshes the 300 stalest tickers (Yahoo Finance, no key) plus a few new seed tickers. Each data change redeploys the site and Actions artifact storage is limited, so keep this modest
  workflow_dispatch:
    inputs:
      batch:
        description: "Tickers to refresh this run"
        default: "300"
permissions:
  contents: write
concurrency:
  group: data-refresh        # the two refresh jobs both write splits.json, so they take turns
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-data.mjs
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          BATCH: ${{ inputs.batch }}
      - name: Commit changes
        run: |
          git config user.name "payout-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json splits.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dividend data"
          # main moves while a long run is working (seed additions, the other refresh): rebase and retry instead of losing the run
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep $((i * 5)); done
          exit 1
