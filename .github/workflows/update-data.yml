name: Refresh dividend data
on:
  schedule:
    - cron: "17 * * * *"   # hourly, every day; each run adds new seed tickers first and refreshes the stalest (45 per run keeps inside the Tiingo free hourly limit)
  workflow_dispatch:
    inputs:
      batch:
        description: "Tickers to refresh this run"
        default: "45"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-data.mjs
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          BATCH: ${{ inputs.batch }}
      - name: Commit changes
        run: |
          git config user.name "payout-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Refresh dividend data" && git push)
