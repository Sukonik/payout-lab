name: Test
on:
  pull_request:
  push:
    branches: [main]
    paths: ["js/**", "css/**", "index.html", "e2e/**", "tests/**", "scripts/**", "releases.json", "package.json", ".github/workflows/test.yml"]
permissions:
  contents: read
env:
  CI: "true"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save jsqr@1.4.0   # test-only QR decoder; not shipped
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the V1 regression check and release check read the baseline commit
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.56.1 jsqr@1.4.0   # jsqr only decodes QR images in tests
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          for t in packets workspace refresh import return hardening receipts links qr regression-v1 release; do
            echo "::group::$t"; node e2e/$t.mjs || { echo "::endgroup::"; exit 1; }; echo "::endgroup::"
          done
