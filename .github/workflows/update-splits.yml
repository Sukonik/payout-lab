name: Refresh split data
on:
  schedule:
    - cron: "41 3 * * 1-5"   # once per weekday; split HISTORY now comes from the main price refresh, this job only keeps the announced list
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Announced splits (Nasdaq public calendar)
        run: node scripts/update-upcoming.mjs
        continue-on-error: true   # unofficial endpoint: a failure is reported but must not block the history refresh or the commit
      - name: Commit changes
        run: |
          git config user.name "payout-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add splits.json
          git diff --cached --quiet || (git commit -m "Refresh split data" && git push)
